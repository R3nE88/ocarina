services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ocarina:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/ocarina
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      REPORT_THRESHOLD: ${REPORT_THRESHOLD:-3}
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000" # local testing only; Dokploy routes the domain through Traefik
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ocarina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ocarina
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocarina -d ocarina"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
