<style>
  @font-face { font-family:Almendra; font-weight:700; font-display:swap; src:url(/fonts/almendra-700.woff2) format("woff2"); }

<script src="/i18n.js"></script>
<script>
const $ = id => document.getElementById(id);

/* ---------- Ocarina model (from the official guide) ---------- */
const BUTTONS = [ // base pitch of each button (MIDI)
  { id: 'A',  midi: 62 }, // D4
  { id: 'Cd', midi: 65 }, // F4
  { id: 'Cr', midi: 69 }, // A4
  { id: 'Cl', midi: 71 }, // B4
  { id: 'Cu', midi: 74 }, // D5
];
let MIN_MIDI = 59, MAX_MIDI = 77; // playable range of the selected instrument (game ocarina: B3 .. F5)
// stick up/down = ±2 semitones, R = +1, Z = -1

function comboFor(midi, accidental) {
  let best = null;
  for (const b of BUTTONS) for (const stick of [0, 2, -2]) for (const mod of [0, 1, -1]) {
    if (b.midi + stick + mod !== midi) continue;
    let cost = (stick ? 1 : 0) + (mod ? 1.1 : 0);
    if (mod && accidental && mod !== accidental) cost += 0.05; // sharp → prefer R, flat → prefer Z
    if (mod === -1 && !accidental) cost += 0.05;
    if (!best || cost < best.cost) best = { button: b.id, stick, mod, cost };
  }
  return best;
}

/* ---------- Pitch helpers ---------- */
const STEP_SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const STEP_IDX = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
const SHARP_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NAMES  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const ALTER = { '': 0, '#': 1, 'x': 2, '##': 2, 'b': -1, 'bb': -2 };

const toMidi = (letter, alter, octave) => (octave + 1) * 12 + STEP_SEMI[letter] + alter;

function spell(midi, preferFlat) {
  const name = (preferFlat ? FLAT_NAMES : SHARP_NAMES)[((midi % 12) + 12) % 12];
  return { letter: name[0], alter: name.length > 1 ? (name[1] === '#' ? 1 : -1) : 0, octave: Math.floor(midi / 12) - 1 };
}

const noteName = (l, a, o) => l + (a > 0 ? '#'.repeat(a) : 'b'.repeat(-a)) + o;

/* ---------- Text parser ---------- */
function parseText(src) {
  const events = [], errors = [];
  let beats = 1, tied = null; // tied: note ending in "~", extended by the next note of the same pitch
  src.split(/\r?\n/).forEach((raw, li) => {
    const line = raw.replace(/%.*$/, '').trim();
    if (!line) return;
    for (const tok of line.split(/\s+/)) {
      if (tok === '|') { events.push({ type: 'bar' }); continue; }
      let m = tok.match(/^([A-Ga-g])(##|bb|#|b|x)?(\d)(?::(\d+)(\.?))?(~?)$/);
      if (m) {
        if (m[4]) beats = 4 / +m[4] * (m[5] ? 1.5 : 1);
        const letter = m[1].toUpperCase(), alter = ALTER[m[2] || ''], octave = +m[3];
        const midi = toMidi(letter, alter, octave);
        let note;
        if (tied && tied.midi === midi) { tied.beats += beats; note = tied; }
        else { note = { type: 'note', letter, alter, octave, midi, beats }; events.push(note); }
        tied = m[6] ? note : null;
        continue;
      }
      m = tok.match(/^[rR](?::(\d+)(\.?))?$/);
      if (m) {
        tied = null;
        if (m[1]) beats = 4 / +m[1] * (m[2] ? 1.5 : 1);
        events.push({ type: 'rest', beats });
        continue;
      }
      errors.push(t('err.token', { line: li + 1, tok }));
    }
    events.push({ type: 'break' });
  });
  return { events, errors };
}

/* ---------- MusicXML import → text ---------- */
function parseMusicXML(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error(t('err.musicxml'));
  const title = doc.querySelector('work-title')?.textContent || doc.querySelector('movement-title')?.textContent || '';
  const composer = doc.querySelector('creator[type="composer"]')?.textContent || '';
  const part = doc.querySelector('part');
  if (!part) throw new Error(t('err.noPart'));

  let divisions = 1, firstVoice = null, last = null;
  const measures = [];
  for (const meas of part.querySelectorAll(':scope > measure')) {
    const div = meas.querySelector('attributes > divisions');
    if (div) divisions = +div.textContent;
    const evs = [];
    for (const n of meas.querySelectorAll(':scope > note')) {
      if (n.querySelector('grace')) continue;
      const voice = n.querySelector('voice')?.textContent || '1';
      if (firstVoice === null) firstVoice = voice;
      if (voice !== firstVoice) continue;
      const dur = +(n.querySelector('duration')?.textContent || 0) / divisions;
      const p = n.querySelector('pitch');
      const pitch = p && {
        letter: p.querySelector('step').textContent,
        alter: Math.round(+(p.querySelector('alter')?.textContent || 0)),
        octave: +p.querySelector('octave').textContent,
      };
      if (pitch) pitch.midi = toMidi(pitch.letter, pitch.alter, pitch.octave);
      if (n.querySelector('chord')) { // keep the top note of a chord as melody
        if (pitch && last && pitch.midi > last.midi) Object.assign(last, pitch);
        continue;
      }
      if (n.querySelector('rest') || !pitch) { last = { type: 'rest', beats: dur }; evs.push(last); last = null; continue; }
      const tieStop = [...n.querySelectorAll('tie')].some(t => t.getAttribute('type') === 'stop');
      if (tieStop && last && last.midi === pitch.midi) { last.beats += dur; continue; }
      last = { type: 'note', ...pitch, beats: dur };
      evs.push(last);
    }
    measures.push(evs);
  }

  // serialize to the text format (4 measures per text line)
  let out = '', cur = null;
  measures.forEach((evs, i) => {
    const toks = evs.map(e => {
      let d = durToken(e.beats);
      if (d === cur) d = ''; else cur = d;
      return (e.type === 'rest' ? 'r' : noteName(e.letter, e.alter, e.octave)) + d;
    });
    if (toks.length) out += toks.join(' ') + ' | ';
    if ((i + 1) % 4 === 0) out = out.trimEnd() + '\n';
  });
  return { title, composer, text: out.trim() };
}

function durToken(b) {
  const table = [[1, 4], [2, 2], [4, 1], [8, .5], [16, .25], [32, .125]];
  for (const [den, v] of table) {
    if (Math.abs(b - v) < 1e-6) return ':' + den;
    if (Math.abs(b - v * 1.5) < 1e-6) return ':' + den + '.';
  }
  let best = table[0];
  for (const t of table) if (Math.abs(b - t[1]) < Math.abs(b - best[1])) best = t;
  return ':' + best[0];
}

/* ---------- MIDI import → text ---------- */
function parseMidi(buf) {
  const dv = new DataView(buf);
  let p = 0;
  const str = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(dv.getUint8(p + i)); p += n; return s; };
  const u32 = () => { const v = dv.getUint32(p); p += 4; return v; };
  const u16 = () => { const v = dv.getUint16(p); p += 2; return v; };
  const vlq = () => { let v = 0, b; do { b = dv.getUint8(p++); v = (v << 7) | (b & 0x7f); } while (b & 0x80); return v; };

  if (str(4) !== 'MThd') throw new Error(t('err.midi'));
  const hlen = u32(); u16();
  const ntrk = u16(), ppq = u16();
  p += hlen - 6;
  if (ppq & 0x8000) throw new Error(t('err.smpte'));

  let timeSig = null, keySf = 0, tempo = null;
  const sources = [], tempos = [], drums = [];
  for (let tr = 0; tr < ntrk && p + 8 <= dv.byteLength; tr++) {
    const id = str(4), len = u32(), end = Math.min(p + len, dv.byteLength);
    if (id !== 'MTrk') { p = end; continue; }
    let tick = 0, status = 0, name = '';
    const open = {}, byChannel = {};
    while (p < end) {
      tick += vlq();
      const b = dv.getUint8(p);
      if (b === 0xff) { // meta event
        const type = dv.getUint8(p + 1); p += 2;
        const l = vlq(), d = p; p += l;
        if (type === 0x03 && !name) { for (let i = 0; i < l; i++) name += String.fromCharCode(dv.getUint8(d + i)); }
        if (type === 0x58 && !timeSig) timeSig = [dv.getUint8(d), 2 ** dv.getUint8(d + 1)];
        if (type === 0x59 && !keySf) keySf = dv.getInt8(d);
        if (type === 0x51) {
          const us = (dv.getUint8(d) << 16) | (dv.getUint8(d + 1) << 8) | dv.getUint8(d + 2);
          tempos.push({ tick, us });
          if (!tempo) tempo = 60e6 / us;
        }
        continue;
      }
      if (b === 0xf0 || b === 0xf7) { p++; p += vlq(); continue; } // sysex
      if (b & 0x80) { status = b; p++; } // otherwise running status
      const type = status >> 4, ch = status & 15;
      const d1 = dv.getUint8(p++);
      const d2 = type === 0xc || type === 0xd ? 0 : dv.getUint8(p++);
      if (ch === 9) { // drums: only used for full playback
        if (type === 0x9 && d2 > 0) drums.push({ start: tick, midi: d1, vel: d2 });
        continue;
      }
      if (type === 0x9 && d2 > 0) {
        (open[ch * 128 + d1] ||= []).push({ tick, vel: d2 });
      } else if (type === 0x8 || type === 0x9) {
        const on = open[ch * 128 + d1]?.shift();
        if (on) (byChannel[ch] ||= []).push({ start: on.tick, end: tick, midi: d1, vel: on.vel });
      }
    }
    p = end;
    const chans = Object.keys(byChannel);
    for (const ch of chans) {
      const notes = byChannel[ch].sort((a, b) => a.start - b.start);
      const lo = Math.min(...notes.map(n => n.midi)), hi = Math.max(...notes.map(n => n.midi));
      const nm = name.trim() || t('midi.track', { n: tr + 1 });
      sources.push({
        name: nm, notes,
        label: `${nm}${chans.length > 1 ? ` · ${t('midi.channel', { n: +ch + 1 })}` : ''} · ${t('midi.notes', { n: notes.length })} · ${noteName(...Object.values(spell(lo)))}–${noteName(...Object.values(spell(hi)))}`,
      });
    }
  }
  return { ppq, timeSig: timeSig || [4, 4], keySf, tempo, tempos, drums, sources };
}

function pickMelody(sources) {
  const named = sources.findIndex(s => /melod|lead|vocal|voice|flute|ocarina|solo|main/i.test(s.name));
  if (named >= 0) return named;
  let best = 0, bestScore = -Infinity;
  sources.forEach((s, i) => {
    const avg = s.notes.reduce((a, n) => a + n.midi, 0) / s.notes.length;
    const score = avg + Math.min(s.notes.length, 200) / 10; // high & busy tracks tend to be the melody
    if (score > bestScore) { best = i; bestScore = score; }
  });
  return best;
}

function midiToText(midi, src) {
  const { ppq } = midi, grid = ppq / 4; // quantize to 16th notes
  const q = x => Math.round(x / grid) * grid;
  const byStart = new Map();
  for (const n of src.notes) { // keep the highest note at each onset
    const s = q(n.start), cur = byStart.get(s);
    if (!cur || n.midi > cur.midi) byStart.set(s, { start: s, end: Math.max(s + grid, q(n.end)), midi: n.midi });
  }
  const mel = [...byStart.values()].sort((a, b) => a.start - b.start);
  if (!mel.length) return '';

  const measTicks = ppq * 4 * midi.timeSig[0] / midi.timeSig[1];
  const toks = [];
  let cur = null, measure = Math.floor(mel[0].start / measTicks), pos = measure * measTicks, count = 0;
  const emit = (name, ticks) => { let d = durToken(ticks / ppq); if (d === cur) d = ''; else cur = d; toks.push(name + d); };
  const barCheck = () => { while (pos >= (measure + 1) * measTicks) { measure++; toks.push(++count % 4 === 0 ? '|\n' : '|'); } };

  mel.forEach((n, i) => {
    while (pos < n.start) { // rests, split at barlines
      const e = Math.min(n.start, (measure + 1) * measTicks);
      if (e - pos >= grid) emit('r', e - pos);
      pos = e; barCheck();
    }
    const end = Math.min(n.end, mel[i + 1]?.start ?? Infinity);
    const sp = spell(n.midi, midi.keySf < 0);
    emit(noteName(sp.letter, sp.alter, sp.octave), end - n.start);
    pos = end; barCheck();
  });
  return toks.join(' ').replace(/ ?\n ?/g, '\n').trim();
}

/* ---------- Transposition ---------- */
function computeShift(notes, setting) {
  if (setting !== 'auto') return +setting;
  if (!notes.length) return 0;
  // fewest notes out of range, then octave shifts over semitone shifts, then the smallest shift
  let best = 0, bestKey = null;
  for (let s = -48; s <= 48; s++) {
    const key = [notes.filter(n => n.midi + s < MIN_MIDI || n.midi + s > MAX_MIDI).length, s % 12 !== 0 ? 1 : 0, Math.abs(s)];
    if (!bestKey || key[0] - bestKey[0] < 0 || (key[0] === bestKey[0] && (key[1] < bestKey[1] || (key[1] === bestKey[1] && key[2] < bestKey[2])))) {
      best = s; bestKey = key;
    }
  }
  return best;
}

let MIN_ADVANCE = 40, ADV_UNIT = 52, ADV_EXP = 0.6; // real-ocarina mode: wider notes, flatter spacing
const advance = e => Math.max(MIN_ADVANCE, ADV_UNIT * Math.pow(e.beats || 1, ADV_EXP));

function buildLines(events, opts) {
  const avail = CONTENT_R - CONTENT_L;
  const segs = [];
  let cur = [];
  for (const ev of events) {
    if (ev.type === 'bar') { segs.push({ items: cur, bar: true }); cur = []; }
    else if (ev.type === 'break') { segs.push({ items: cur, brk: true }); cur = []; }
    else cur.push(ev);
  }
  if (cur.length) segs.push({ items: cur });

  const lines = [];
  let line = [], x = 0, measures = 0;
  const flush = () => { if (line.some(i => !i.bar)) lines.push(line); line = []; x = 0; measures = 0; };
  for (const seg of segs) {
    const w = seg.items.reduce((s, e) => s + advance(e), 0);
    if (line.length && x + w > avail) flush();
    for (const e of seg.items) {
      const a = advance(e);
      if (line.length && x + a > avail) flush();
      line.push({ ev: e, x });
      x += a;
    }
    if (seg.bar && seg.items.length) {
      line.push({ bar: true, x });
      if (opts.bars) x += 10;
      if (opts.mpl && ++measures >= opts.mpl) flush();
    }
    if (seg.brk) flush();
  }
  flush();
  return lines;
}

const OC_BODY = 'M236,150 C228,112 290,72 370,55 C420,44 462,34 484,36 C474,62 446,110 424,150 C404,184 340,192 290,184 C256,178 240,168 236,150Z';
const OC_HOLES = {
  LT: [262, 202, 13], RT: [440, 176, 13], // thumb holes are underneath: drawn as dots below the body
  L1: [277, 143, 13], L2: [303, 126, 13], L3: [330, 110, 13], L4: [343, 83, 10],

};
const OC_SCALE = 0.25, OC_W = 270 * OC_SCALE, DIAG_H = 190 * OC_SCALE;

function ocarinaDiagram(x, y, scale, closed, labels) {
  let s = `<g transform="translate(${x} ${y}) scale(${scale}) translate(-225 -28)">` +
          `<path class="ocb" d="${OC_BODY}" fill="#fff" stroke="#1b1b1b" stroke-width="5" stroke-linejoin="round"/>`;
  for (const [hole, [hx, hy, r]] of Object.entries(OC_HOLES)) {
    s += `<circle cx="${hx}" cy="${hy}" r="${r}" fill="${closed.has(hole) ? '#1b1b1b' : '#fff'}" stroke="#1b1b1b" stroke-width="3.5"/>`;
    if (labels) s += `<text x="${hx}" y="${hy + (r < 10 ? 5 : 7)}" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="${r < 10 ? 12 : 19}" fill="#7a1e10">${labels[hole]}</text>`;
  }
  return s + '</g>';
}

function drawRealNote(n, cx, cy, staffTop, diagY, id) {
  let s = `<g class="note real" id="${id}">`;
  for (const d of [28, 26]) { // ledger lines for C4 and A3

    s += `<line x1="${cx - 11}" x2="${cx + 11}" y1="${ly}" y2="${ly}" stroke="#9b6a5c" stroke-width="1.4"/>`;
  }

  s += `<ellipse class="nh" cx="${cx}" cy="${cy}" rx="6.8" ry="5" transform="rotate(-20 ${cx} ${cy})" fill="${hollow ? 'none' : '#1b1b1b'}" stroke="#1b1b1b" stroke-width="${hollow ? 2 : 1}"/>`;

  s += ocarinaDiagram(cx - OC_W / 2, diagY, OC_SCALE, new Set(n.combo.holes.split(' ')));
  return s + '</g>';
}

// D-pad centered on (x, y) with the up (sharp) or down (flat) arm highlighted
function dpad(x, y, up, a = 3.3, L = 9) {

// Rhythm mode: stick and R/Z/D-pad go in chips beside the button, because the note's tail covers what is above it
const CHIP_W = 16, CHIP_H = 24, CHIP_GAP = 5, CHIPS_W = 2 * (R + CHIP_GAP + CHIP_W);
function comboChips(c, ds) {
  const chip = x => `<rect x="${x}" y="${-CHIP_H / 2}" width="${CHIP_W}" height="${CHIP_H}" rx="5" fill="#fff" stroke="#111" stroke-width="1.6"/>`;
  let s = '';
  if (c.stick) {
    const x = -R - CHIP_GAP - CHIP_W, ax = x + CHIP_W / 2, k = c.stick > 0 ? 1 : -1;
    s += chip(x) + `<line x1="${ax}" x2="${ax}" y1="${8 * k}" y2="${-1 * k}" stroke="#111" stroke-width="3" stroke-linecap="round"/>` +
         `<path d="M${ax},${-9 * k} L${ax - 5.5},${-1 * k} L${ax + 5.5},${-1 * k}Z" fill="#111" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/>`;
  }
  if (c.mod) {
    const x = R + CHIP_GAP;
    s += chip(x) + (ds ? dpad(x + CHIP_W / 2, 0, c.mod > 0, 2.6, 7.2)
                       : `<text x="${x + CHIP_W / 2}" y="5.5" text-anchor="middle" font-family="Arial" font-weight="700" font-size="15" fill="#111">${c.mod > 0 ? 'R' : 'Z'}</text>`);
  }
  return s;
}

  } else if (c.mod < 0) {

         `<text x="${cx - R - 6.5}" y="${cy + 13}" text-anchor="middle" font-family="Arial" font-weight="700" font-size="12" fill="#fff">Z</text>`;
  }
  return s + '</g>';
}

let playList = [];

function render() {
  const opts = { names: $('names').checked, bars: $('bars').checked, ledger: $('ledger').checked, mpl: +$('mpl').value };
  const real = $('game').value === 'real';
  [MIN_MIDI, MAX_MIDI] = real ? [57, 77] : [59, 77];
  [MIN_ADVANCE, ADV_UNIT, ADV_EXP] = real ? [70, 70, 0.3] : [40, 52, 0.6];
  const rangeName = real ? 'A3–F5' : 'B3–F5';
  const { events, errors } = parseText($('src').value);
  const notes = events.filter(e => e.type === 'note');
  const shift = computeShift(notes, $('transpose').value);
  const msgs = errors.map(e => ({ warn: true, text: e }));

  let outOfRange = [], folded = 0;
  for (const n of notes) {
    let pm = n.midi + shift, fold = 0;
    if ($('fold').checked) {
      while (pm + fold < MIN_MIDI) fold += 12;
      while (pm + fold > MAX_MIDI) fold -= 12;
      if (fold) folded++;
    }
    pm += fold;
    const sp = (shift + fold) % 12 === 0 ? { letter: n.letter, alter: n.alter, octave: n.octave + (shift + fold) / 12 } : spell(pm, n.alter < 0);
    n.pm = pm;
    n.name = noteName(sp.letter, sp.alter, sp.octave);
    n.d = Math.max(22, Math.min(42, STEP_IDX[sp.letter] + sp.octave * 7));
    const playable = pm >= MIN_MIDI && pm <= MAX_MIDI;
    n.combo = !playable ? null : real ? { holes: REAL_FINGERING[pm] } : comboFor(pm, Math.sign(sp.alter));
    n.alterShown = sp.alter;
    if (!n.combo) outOfRange.push(n.name);
  }

  if (notes.length) msgs.push({ text: t('msg.notes', { n: notes.length }) + (shift ? t('msg.transposed', { shift: (shift > 0 ? '+' : '') + shift, range: rangeName }) : '') });
  if (outOfRange.length) msgs.push({ warn: true, text: t('msg.outOfRange', { n: outOfRange.length, names: [...new Set(outOfRange)].join(', ') }) });

  if (folded) msgs.push({ text: t('msg.folded', { n: folded }) });

  const title = $('title').value.trim(), subtitle = $('subtitle').value.trim();
  const legendH = real ? 104 : LEGEND_H;
  const headerH = (title || subtitle ? M + 96 : M + 20) + legendH;
  const blocks = []; // one per staff line, drawn from y = 0
  let idx = 0;
  playList = [];

  for (const line of buildLines(events, opts)) {
    let body = '';
    let top = -S, bot = 9 * S;
    for (const it of line) {
      const n = it.ev;
      if (!n || n.type !== 'note') continue;
      const yy = (38 - n.d) * S, c = n.combo || {};
      if (real && n.combo) { top = Math.min(top, yy - 12); bot = Math.max(bot, yy + 10); continue; }
      top = Math.min(top, yy - R - (c.stick > 0 ? 20 : 0) - (c.mod > 0 ? 10 : 2));
      bot = Math.max(bot, yy + R + (c.stick < 0 ? 20 : 0) + (c.mod < 0 ? 6 : 4));
    }
    const diagTop = bot + 6; // fingering diagrams go under the staff
    if (real) bot += DIAG_H + 12;
    if (opts.names) bot += 20;
    const staffTop = -top + 4;

    for (let k = 0; k < 5; k++) {
      const ly = staffTop + k * 2 * S;
      body += `<line x1="${M + 16}" x2="${W - M - 16}" y1="${ly}" y2="${ly}" stroke="#9b6a5c" stroke-width="1.4"/>`;
    }
    body += `<use href="#clef" transform="translate(${M + 22} ${staffTop + 6.9 * S}) scale(${CLEF_SCALE} ${-CLEF_SCALE})"/>`;

    line.forEach((it, i) => {
      if (it.bar) {
        if (opts.bars && i < line.length - 1) {
          const bx = CONTENT_L + it.x + 2;
          body += `<line x1="${bx}" x2="${bx}" y1="${staffTop}" y2="${staffTop + 8 * S}" stroke="#9b6a5c" stroke-width="1.4"/>`;
        }
        playList.push({ beats: 0, bar: true });
        return;
      }
      const n = it.ev;
      if (n.type === 'rest') { playList.push({ beats: n.beats }); return; }
      const cx = CONTENT_L + it.x + 20, cy = staffTop + (38 - n.d) * S, id = 'n' + idx++, cw = real ? OC_W + 8 : 2 * R + 20;
      body += `<rect class="cur" id="${id}c" x="${cx - cw / 2}" y="${staffTop + top - 2}" width="${cw}" height="${bot - top + 2}" rx="6"/>`; // playback cursor
      body += real && n.combo ? drawRealNote(n, cx, cy, staffTop, staffTop + diagTop, id) : drawButton(n, cx, cy, id, opts);
      if (opts.names) body += `<text x="${cx}" y="${staffTop + bot - 4}" text-anchor="middle" font-family="Arial" font-size="11" fill="#6b4a3a">${n.name}</text>`;
      playList.push({ midi: n.combo ? n.pm + (real ? 12 : 0) : null, beats: n.beats, id, n }); // real alto C sounds an octave up
    });
    blocks.push({ body, h: staffTop + bot + 14 });
  }

  // US-letter pages: the screen shows exactly what PNG, SVG and print/PDF produce
  const pages = [[]], contTop = M + 46, pageBottom = PAGE_H - M - 26;
  let y = headerH;
  for (const b of blocks) {
    if (y + b.h > pageBottom && pages.at(-1).length) { pages.push([]); y = contTop; }
    pages.at(-1).push(`<g transform="translate(0 ${y})">${b.body}</g>`);
    y += b.h;
  }
  const total = pages.length;
  $('sheet').innerHTML = pages.map((p, i) => sheetPage(p.join(''), i, total, { title, subtitle, real, headerH, legendH })).join('');
  if (total > 1) msgs.push({ text: t('msg.pages', { n: total }) });
  $('msg').innerHTML = msgs.map(m => `<div class="${m.warn ? 'warn' : ''}">${esc(m.text)}</div>`).join('');
}

function sheetPage(body, i, total, { title, subtitle, real, headerH, legendH }) {
  const H = PAGE_H;
  let head;
  if (i === 0) {
    head = (title ? `<text x="${W / 2}" y="${M + 48}" text-anchor="middle" font-family="Almendra, Georgia, serif" font-weight="700" font-size="38" fill="#7a1e10">${esc(title)}</text>` : '') +
      (subtitle ? `<text x="${W / 2}" y="${M + 70}" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#b5560c" letter-spacing=".5">${esc(subtitle.toUpperCase())}</text>` : '') +
      (real ? realLegend(headerH - legendH + 4) : gameLegend(headerH - legendH));
  } else { // running header on the following pages
    head = `<text x="${W / 2}" y="${M + 26}" text-anchor="middle" font-family="Almendra, Georgia, serif" font-weight="700" font-size="20" fill="#7a1e10">${esc(title)}</text>`;
  }
  const folio = total > 1 ? `<text x="${W / 2}" y="${H - M - 6}" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#7a5a4a">${i + 1} / ${total}</text>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs>
      <path id="clef" d="${CLEF_PATH}" fill="#2b1a12"/>
      <radialGradient id="gA" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#7d97ff"/><stop offset="1" stop-color="#1c3cc4"/></radialGradient>
      <radialGradient id="gC" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff58a"/><stop offset="1" stop-color="#e6b000"/></radialGradient>
      <radialGradient id="gS" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#f6f2e4"/><stop offset="1" stop-color="#aea78f"/></radialGradient>
      <radialGradient id="gK" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#5a5a5e"/><stop offset="1" stop-color="#121214"/></radialGradient>
    </defs>
    <rect x="0" y="0" width="${W}" height="${H}" fill="#f4e9a6"/>
    <rect x="${M / 2}" y="${M / 2}" width="${W - M}" height="${H - M}" fill="none" stroke="#8e2b1b" stroke-width="4"/>
    ${head}
    ${body}
    ${folio}
  </svg>`;
}

/* ---------- Playback ---------- */
let actx = null, voices = [], timers = [], midiTimer = null, midiOut = null;
function stop() {
  timers.forEach(clearTimeout); timers = [];
  clearInterval(midiTimer); midiTimer = null;
  if (midiOut) { midiOut.disconnect(); midiOut = null; }
  voices.forEach(o => { try { o.stop(); } catch (e) {} }); voices = [];
  document.querySelectorAll('.playing, .done').forEach(e => e.classList.remove('playing', 'done'));
}
// sheet playback: the current note gets a cursor band, played notes fade, and the view follows the song
function markPlaying(id) {
  document.querySelectorAll('#sheet .playing').forEach(e => { e.classList.remove('playing'); e.classList.add('done'); });
  const note = id && $(id);
  if (!note) return;
  note.classList.add('playing');
  const cur = $(id + 'c');
  cur.classList.add('playing');
  const r = cur.getBoundingClientRect(), box = document.querySelector('main').getBoundingClientRect();
  const top = Math.max(0, box.top), bottom = Math.min(innerHeight, box.bottom);
  if (r.top < top + 40 || r.bottom > bottom - 40) {
    cur.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }
}
function ocarinaVoice(midi, t, dur) {
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const g = actx.createGain(); g.connect(actx.destination);
  const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(g);
  const g2 = actx.createGain(); g2.gain.value = 0.12; g2.connect(g);
  const o2 = actx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2; o2.connect(g2);
  const lfo = actx.createOscillator(); lfo.frequency.value = 5.5;
  const lg = actx.createGain(); lg.gain.value = f * 0.005; lfo.connect(lg); lg.connect(o.frequency);
  const end = t + Math.max(0.08, dur * 0.92);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.28, t + 0.04);
  g.gain.setValueAtTime(0.28, end - 0.05);
  g.gain.linearRampToValueAtTime(0, end);
  for (const osc of [o, o2, lfo]) { osc.start(t); osc.stop(end + 0.02); voices.push(osc); }
}
function play() {
  stop();
  actx = actx || new AudioContext();
  actx.resume(); // mobile browsers start the context suspended
  const spb = 60 / (+$('tempo').value || 110);
  const t0 = actx.currentTime + 0.1;
  let t = t0;
  for (const p of playList) {
    const dur = p.beats * spb;
    if (p.id) timers.push(setTimeout(() => markPlaying(p.id), (t - t0 + 0.1) * 1000));
    if (p.midi != null) ocarinaVoice(p.midi, t, dur);
    t += dur;
  }
  timers.push(setTimeout(stop, (t - t0 + 0.6) * 1000));
}

/* ---------- Full MIDI playback (all tracks) ---------- */
function makeTickToSec(midi) {
  const map = [{ tick: 0, sec: 0, us: 500000 }];
  for (const t of [...midi.tempos].sort((a, b) => a.tick - b.tick)) {
    const last = map[map.length - 1];
    if (t.tick === last.tick) { last.us = t.us; continue; }
    map.push({ tick: t.tick, sec: last.sec + (t.tick - last.tick) / midi.ppq * last.us / 1e6, us: t.us });
  }
  return tick => {
    let m = map[0];
    for (const e of map) { if (e.tick <= tick) m = e; else break; }
    return m.sec + (tick - m.tick) / midi.ppq * m.us / 1e6;
  };
}

const WAVES = [['triangle', 0.16], ['square', 0.05], ['sawtooth', 0.05], ['sine', 0.2]];
let noiseBuf = null;

function synthNote(out, t, d, midi, vel, [wave, level]) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave;
  o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  const peak = level * vel / 127;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.01);
  g.gain.setTargetAtTime(peak * 0.6, t + 0.01, 0.3);
  g.gain.setTargetAtTime(0, t + d, 0.05);
  o.connect(g); g.connect(out);
  o.start(t); o.stop(t + d + 0.4);
}

function drumHit(out, t, midi, vel) {
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.4, actx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noiseBuf;
  const kick = midi === 35 || midi === 36, hat = [42, 44, 46, 49, 51, 57].includes(midi);
  f.type = kick ? 'lowpass' : hat ? 'highpass' : 'bandpass';
  f.frequency.value = kick ? 160 : hat ? 7000 : 1800;
  const len = kick ? 0.25 : hat ? 0.06 : 0.15;
  g.gain.setValueAtTime((kick ? 0.9 : 0.25) * vel / 127, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + len);
  src.connect(f); f.connect(g); g.connect(out);
  src.start(t); src.stop(t + len + 0.05);
}

const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function playMidiAll() {
  if (!midiData) return;
  stop();
  actx = actx || new AudioContext();
  actx.resume(); // mobile browsers start the context suspended
  const sec = makeTickToSec(midiData), events = [];
  midiData.sources.forEach((s, si) => {
    for (const n of s.notes) {
      const t = sec(n.start);
      events.push({ t, d: Math.max(0.05, sec(n.end) - t), midi: n.midi, vel: n.vel, voice: WAVES[si % WAVES.length] });
    }
  });
  for (const h of midiData.drums) events.push({ t: sec(h.start), drum: true, midi: h.midi, vel: h.vel });
  events.sort((a, b) => a.t - b.t);
  const total = events.reduce((m, e) => Math.max(m, e.t + (e.d || 0.2)), 0);

  const out = midiOut = actx.createGain();
  out.gain.value = 0.6;
  out.connect(actx.destination);
  const t0 = actx.currentTime + 0.15;
  let i = 0;
  const pump = () => { // schedule ~1s ahead so long songs don't create thousands of nodes at once
    const now = actx.currentTime - t0;
    while (i < events.length && events[i].t < now + 1) {
      const e = events[i++];
      if (e.drum) drumHit(out, t0 + e.t, e.midi, e.vel);
      else synthNote(out, t0 + e.t, e.d, e.midi, e.vel, e.voice);
    }
    $('midiTime').textContent = `${fmtTime(Math.max(0, now))} / ${fmtTime(total)}`;
    if (now > total + 0.5) stop();
  };
  pump();
  midiTimer = setInterval(pump, 100);
}

/* ---------- Rhythm mode: notes fall to a line and the player performs on their own console ---------- */
// The page never hears the console, so there is no scoring: it only shows what to press and when.
// The song clock counts beats, so changing the tempo mid-song keeps the falling notes in place.
const rz = { state: 'idle', real: false, chart: null, beat: 0, start: 0, last: 0, raf: 0, wake: null,
             live: [], liveBars: [], next: 0, nextBar: 0, sched: 0, lanes: [] };
const RZ_TAIL = { // [first lane, other lanes] as fill/stroke
  n64:  [['#1c3cc4', '#12225e'], ['#e6b000', '#7a5700']],
  '3ds': [['#aea78f', '#3f3a2e'], ['#aea78f', '#3f3a2e']],
  sw2:  [['#2a2a2e', '#0a0a0a'], ['#2a2a2e', '#0a0a0a']],
  real: [['#c9745f', '#7a1e10'], ['#c9745f', '#7a1e10']],
};
const firstIndex = (arr, test) => { const i = arr.findIndex(test); return i < 0 ? arr.length : i; };
const rzBaseBpm = () => +$('tempo').value || 110;
const rzBps = () => rzBaseBpm() * +$('rzTempo').value / 6000; // beats per second at the chosen tempo %

function rzChart() {
  const ids = BUTTONS.map(b => b.id), notes = [], bars = [];
  let beat = 0;
  for (const p of playList) {
    if (p.bar) { bars.push(beat); continue; }
    if (p.n) {
      const nearest = BUTTONS.reduce((best, b, i) => Math.abs(b.midi - p.n.pm) < Math.abs(BUTTONS[best].midi - p.n.pm) ? i : best, 0);
      const lane = rz.real ? 0 : p.n.combo ? ids.indexOf(p.n.combo.button) : nearest;
      notes.push({ n: p.n, midi: p.midi, beat, beats: p.beats, end: beat + p.beats * 0.9, lane }); // the 10% gap shows repeated notes apart
    }
    beat += p.beats;
  }
  return { notes, bars, total: beat };
}

function rzHead(n) {
  if (rz.real && n.combo) {
    return `<g class="note real">${ocarinaDiagram(-135, -91, 1, new Set(n.combo.holes.split(' ')))}` +
           `<text x="150" y="-12" font-family="Arial, sans-serif" font-weight="700" font-size="36" fill="#7a1e10">${n.name}</text></g>`;
  }
  const button = drawButton(n, 0, 0, '', { ledger: false, chips: true });
  return rz.real ? `<g transform="scale(2.4)">${button}</g>` : button;
}

function rzLayout() {
  const { width: W, height: H } = $('rzStage').getBoundingClientRect();
  if (!W || !H) return;
  const count = rz.real ? 1 : BUTTONS.length;
  const trackW = Math.min(W, rz.real ? 460 : 760), x0 = (W - trackW) / 2, laneW = trackW / count;
  const s = rz.real ? Math.min(0.62, H / 800) : Math.min(2, laneW / (CHIPS_W + 3), H / 220);
  const hitY = H - (rz.real ? 100 : 30) * s - 8; // leaves room for a note enlarged at the line
  const visible = +$('rzFall').value * rzBaseBpm() / 60 * (rz.real ? 0.7 : 1); // fingering diagrams are tall, so they need more spacing
  const laneX = i => x0 + laneW * (i + 0.5);
  Object.assign(rz, { H, s, hitY, visible, laneX, x0, trackW, ppb: hitY / visible, tailW: rz.real ? 34 : 13 * s, cueSize: Math.min(W, H) * 0.24 });

  let bg = `<rect x="${x0}" y="0" width="${trackW}" height="${H}" fill="#f4e9a6"/>`, hit = '';
  for (let i = 0; i < count; i++) {
    bg += `<rect class="rz-lane" x="${x0 + laneW * i}" y="0" width="${laneW}" height="${H}"/>`;
    if (i) bg += `<line x1="${x0 + laneW * i}" x2="${x0 + laneW * i}" y1="0" y2="${H}" stroke="#9b6a5c" stroke-width="1.4"/>`;
    const receptor = rz.real ? ocarinaDiagram(-135, -91, 1, new Set())
                             : drawButton({ combo: { button: BUTTONS[i].id, stick: 0, mod: 0 } }, 0, 0, '', { ledger: false });
    hit += `<g opacity=".35" transform="translate(${laneX(i)} ${hitY}) scale(${s})">${receptor}</g>`;
  }
  hit = `<line x1="${x0}" x2="${x0 + trackW}" y1="${hitY}" y2="${hitY}" stroke="#8e2b1b" stroke-width="4"/>` + hit;
  $('rzBg').innerHTML = bg;
  $('rzHit').innerHTML = hit;
  $('rzTop').innerHTML = `<rect x="${x0}" y="0" width="${trackW}" height="${H * 0.14}" fill="url(#rzFade)"/>` +
    `<rect x="${x0 + 1.5}" y="1.5" width="${trackW - 3}" height="${H - 3}" fill="none" stroke="#8e2b1b" stroke-width="3"/>`;
  rz.lanes = [...$('rzBg').querySelectorAll('.rz-lane')];
  const countdown = $('rzCount');
  countdown.setAttribute('x', W / 2);
  countdown.setAttribute('y', hitY * 0.5);
}

function rzSeek(beat) {
  const { notes, bars } = rz.chart;
  rz.beat = beat;
  for (const id of ['rzHeads', 'rzTails', 'rzBars']) $(id).textContent = '';
  rz.live = []; rz.liveBars = [];
  rz.next = firstIndex(notes, c => c.end > beat);
  rz.nextBar = firstIndex(bars, b => b >= beat);
  rz.sched = firstIndex(notes, c => c.beat >= beat);
}

function rzDraw() {
  const { chart: { notes, bars, total }, beat, ppb, hitY, s, tailW, H, laneX } = rz;
  const onStage = b => hitY - (b - beat) * ppb > -120;

  while (rz.nextBar < bars.length && onStage(bars[rz.nextBar])) {
    const b = bars[rz.nextBar++];
    $('rzBars').insertAdjacentHTML('beforeend', '<line stroke="#9b6a5c" stroke-width="1.4" opacity=".7"/>');
    rz.liveBars.push({ b, el: $('rzBars').lastElementChild });
  }
  rz.liveBars = rz.liveBars.filter(l => {
    const y = hitY - (l.b - beat) * ppb;
    if (y > H) { l.el.remove(); return false; }
    l.el.setAttribute('x1', rz.x0); l.el.setAttribute('x2', rz.x0 + rz.trackW);
    l.el.setAttribute('y1', y); l.el.setAttribute('y2', y);
    return true;
  });

  while (rz.next < notes.length && onStage(notes[rz.next].beat)) {
    const c = notes[rz.next++];
    const [fill, stroke] = RZ_TAIL[$('game').value][c.lane ? 1 : 0];
    $('rzTails').insertAdjacentHTML('afterbegin', `<rect fill="${fill}" fill-opacity=".7" stroke="${stroke}" stroke-width="1.2"/>`);
    $('rzHeads').insertAdjacentHTML('afterbegin', `<g>${rzHead(c.n)}</g>`); // earlier notes stay on top
    rz.live.push({ c, tail: $('rzTails').firstElementChild, head: $('rzHeads').firstElementChild });
  }
  const active = new Set();
  rz.live = rz.live.filter(l => {
    const { c } = l;
    if (beat >= c.end) { l.tail.remove(); l.head.remove(); return false; }
    const dy = Math.max(0, (c.beat - beat) * ppb), endDy = (c.end - beat) * ppb; // while held, the note waits on the line and its bar drains
    l.head.setAttribute('transform', `translate(${laneX(c.lane)} ${hitY - dy}) scale(${s})`);
    l.tail.setAttribute('x', laneX(c.lane) - tailW / 2);
    l.tail.setAttribute('y', hitY - endDy);
    l.tail.setAttribute('width', tailW);
    l.tail.setAttribute('height', endDy - dy);
    l.tail.setAttribute('rx', tailW / 2);
    const on = beat >= c.beat;
    if (on) active.add(c.lane);
    l.head.querySelector('.note').classList.toggle('playing', on);
    return true;
  });
  rz.lanes.forEach((el, i) => el.classList.toggle('on', active.has(i)));

  const bps = rzBps();
  const cue = rz.state !== 'run' || beat >= 0 ? '' : beat >= -4 ? Math.ceil(-beat) : t('rz.ready');
  $('rzCount').textContent = cue;
  $('rzCount').setAttribute('font-size', typeof cue === 'number' ? rz.cueSize : rz.cueSize * 0.4);
  $('rzTime').textContent = `${fmtTime(Math.max(0, beat) / bps)} / ${fmtTime(total / bps)}`;
  $('rzProg').style.transform = `scaleX(${Math.min(1, Math.max(0, beat) / total)})`;
}

function rzFrame(now) {
  const dt = Math.min(0.25, (now - rz.last) / 1000), bps = rzBps(), { notes } = rz.chart; // the clamp absorbs a long stall
  rz.last = now;
  rz.beat += dt * bps;
  while (rz.sched < notes.length && notes[rz.sched].beat < rz.beat + 0.3 * bps) { // each note is scheduled shortly before it sounds so it follows the screen
    const c = notes[rz.sched++];
    if (actx && $('rzGuide').checked && c.midi != null && c.beat >= rz.beat) ocarinaVoice(c.midi, actx.currentTime + (c.beat - rz.beat) / bps, c.beats / bps);
  }
  rzDraw();
  if (rz.beat >= rz.chart.total + 1) { rzSetState('done'); return; }
  rz.raf = requestAnimationFrame(rzFrame);
}

function rzAudio() {
  if (!$('rzGuide').checked) return;
  actx = actx || new AudioContext();
  actx.resume();
}

async function rzKeepAwake() { // the screen goes untouched while both hands are on the console
  try { rz.wake = await navigator.wakeLock?.request('screen'); } catch (e) {}
}
function rzAllowSleep() {
  rz.wake?.release().catch(() => {});
  rz.wake = null;
}

function rzSetState(state) {
  rz.state = state;
  cancelAnimationFrame(rz.raf);
  const running = state === 'run';
  if (running) {
    rz.last = performance.now();
    rz.raf = requestAnimationFrame(rzFrame);
    rzKeepAwake();
  } else {
    stop();
    rzAllowSleep();
  }
  const text = {
    idle: [$('title').value.trim() || t('rz.title'), t(rz.real ? 'rz.idle.real' : 'rz.idle.game'), t('rz.start')],
    paused: [t('rz.paused'), t('rz.pausedText'), t('rz.continue')],
    done: [t('rz.done'), t('rz.doneText'), t('rz.again')],
  }[state];
  $('rzPanel').hidden = running;
  $('rzToggle').textContent = running ? t('rz.pause') : text[2];
  if (text) [$('rzPanelTitle').textContent, $('rzPanelText').textContent, $('rzGo').textContent] = text;
}

function rzStart() {
  stop();
  rzAudio();
  rz.start = -Math.ceil(Math.max(4, rz.visible, 5 * rzBps())); // at least 5 s to get back to the controller
  rzSeek(rz.start);
  rzSetState('run');
}

function rzToggle() {
  if (rz.state === 'run') { rzSetState('paused'); return; }
  if (rz.state !== 'paused') { rzStart(); return; }
  rzAudio();
  rzSeek(Math.max(rz.start, rz.beat - 4));
  rzSetState('run');
}

function rzOpen() {
  render(); // pick up edits still waiting on the input debounce
  rz.real = $('game').value === 'real';
  rz.chart = rzChart();
  if (!rz.chart.notes.length) {
    $('msg').insertAdjacentHTML('beforeend', `<div class="warn">${esc(t('rz.empty'))}</div>`);
    return;
  }
  stop();
  $('rzTitle').textContent = $('title').value.trim() || t('rz.title');
  document.documentElement.classList.add('rz-open');
  document.querySelector('.app').inert = true;
  $('rz').hidden = false;
  rzLayout();
  rzSeek(-Math.ceil(rz.visible + 1));
  rzDraw();
  rzSetState('idle');
  $('rzGo').focus();
}

function rzClose() {
  rzSetState('idle');
  $('rz').hidden = true;
  document.documentElement.classList.remove('rz-open');
  document.querySelector('.app').inert = false;
  $('rhythm').focus();
}

$('rhythm').onclick = rzOpen;
$('rzGo').onclick = $('rzToggle').onclick = rzToggle;
$('rzRestart').onclick = rzStart;
$('rzExit').onclick = rzClose;
$('rzFall').onchange = () => { rzLayout(); rzDraw(); };
$('rzGuide').onchange = () => { if ($('rzGuide').checked) { if (rz.state === 'run') rzAudio(); } else stop(); };
// after a mouse click, focus must not stay on a control or Space would press it instead of pausing
$('rz').addEventListener('click', e => { if (e.detail) e.target.closest('button')?.blur(); });
$('rz').addEventListener('change', e => e.target.blur());
document.addEventListener('keydown', e => {
  if ($('rz').hidden) return;
  if (e.key === 'Escape') rzClose();
  else if (e.code === 'Space' && !/^(BUTTON|SELECT|INPUT)$/.test(e.target.tagName)) { e.preventDefault(); rzToggle(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && rz.state === 'run') rzSetState('paused'); });
new ResizeObserver(() => { if (!$('rz').hidden) { rzLayout(); rzDraw(); } }).observe($('rzStage'));

/* ---------- Export ---------- */
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const fileBase = () => ($('title').value.trim() || 'ocarina').replace(/[^\w\-]+/g, '_') + '_' + $('game').value;
// exported SVG/PNG can't reach our font files, so the title font is embedded as a data URL
let fontCss = null;
async function embeddedFontCss() {
  if (!fontCss) {
    const bytes = new Uint8Array(await fetch('/fonts/almendra-700.woff2').then(r => r.arrayBuffer()));
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    fontCss = `@font-face{font-family:Almendra;font-weight:700;src:url(data:font/woff2;base64,${btoa(bin)}) format("woff2")}`;
  }
  return fontCss;
}
async function svgStrings() { // one per letter page
  stop();
  let css = '';
  try { css = await embeddedFontCss(); } catch (e) { /* export still works with a fallback font */ }
  return [...$('sheet').querySelectorAll('svg')].map(page => {
    const svg = page.cloneNode(true);
    svg.querySelectorAll('.cur').forEach(c => c.remove());
    if (css) {
      const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      style.textContent = css;
      svg.insertBefore(style, svg.firstChild);
    }
    return new XMLSerializer().serializeToString(svg);
  });
}

const pngBlob = str => new Promise((resolve, reject) => {
  const img = new Image(), scale = 3; // 2280 × 2949 px: 268 dpi on letter paper
  img.onload = () => setTimeout(() => { // give the embedded font a moment to decode
    const cv = document.createElement('canvas');
    cv.width = W * scale; cv.height = PAGE_H * scale;
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(resolve);
  }, 150);
  img.onerror = reject;
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
});

// a single page downloads as is; several pages go in one .zip so the browser doesn't block the extra downloads
async function savePages(blobs, ext) {
  if (blobs.length === 1) return download(blobs[0], `${fileBase()}.${ext}`);
  const zip = new (await loadJSZip())();
  blobs.forEach((b, i) => zip.file(`${fileBase()}_${t('export.page')}${i + 1}.${ext}`, b));
  download(await zip.generateAsync({ type: 'blob' }), `${fileBase()}_${ext}.zip`);
}
async function exportPages(ext) {
  try {
    const strs = await svgStrings();
    await savePages(ext === 'png' ? await Promise.all(strs.map(pngBlob)) : strs.map(s => new Blob([s], { type: 'image/svg+xml' })), ext);
  } catch (err) {
    $('msg').insertAdjacentHTML('beforeend', `<div class="warn">${esc(t('export.fail', { err: err.message || t('export.unknown') }))}</div>`);
  }
}

$('svgBtn').onclick = () => exportPages('svg');
$('png').onclick = () => exportPages('png');
$('print').onclick = () => window.print();
$('play').onclick = play;
$('stop').onclick = stop;

// JSZip (~95 KB) is only needed for compressed .mxl files, so it loads on demand
let jszipPromise = null;
const loadJSZip = () => jszipPromise ||= new Promise((resolve, reject) => {
  const s = document.createElement('script');
  s.src = '/vendor/jszip-3.10.1.min.js';
  s.onload = () => resolve(window.JSZip);
  s.onerror = () => { jszipPromise = null; reject(new Error(t('err.mxl'))); };
  document.head.appendChild(s);
});

let midiData = null;
function loadMidiTrack() {
  $('src').value = midiToText(midiData, midiData.sources[+$('track').value]);
  $('transpose').value = 'auto';
  render();
}
$('track').onchange = loadMidiTrack;
$('playMidi').onclick = playMidiAll;

$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    if (/\.midi?$/i.test(f.name)) {
      midiData = parseMidi(await f.arrayBuffer());
      if (!midiData.sources.length) throw new Error(t('err.midiEmpty'));
      $('track').innerHTML = midiData.sources.map((s, i) => `<option value="${i}">${esc(s.label)}</option>`).join('');
      $('track').value = pickMelody(midiData.sources);
      $('trackBox').hidden = false;
      $('title').value = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
      $('subtitle').value = '';
      if (midiData.tempo) $('tempo').value = Math.round(midiData.tempo);
      loadMidiTrack();
      e.target.value = '';
      return;
    }
    $('trackBox').hidden = true;
    let text;
    if (/\.mxl$/i.test(f.name)) {
      const zip = await (await loadJSZip()).loadAsync(f);
      let path;
      const container = zip.file('META-INF/container.xml');
      if (container) {
        const c = new DOMParser().parseFromString(await container.async('string'), 'application/xml');
        path = c.querySelector('rootfile')?.getAttribute('full-path');
      }
      path = path || Object.keys(zip.files).find(p => !p.startsWith('META-INF') && /\.(xml|musicxml)$/i.test(p));
      text = await zip.file(path).async('string');
    } else {
      text = await f.text();
    }
    const r = parseMusicXML(text);
    $('src').value = r.text;
    if (r.title) $('title').value = r.title;
    $('subtitle').value = r.composer ? 'Music by ' + r.composer : '';
    $('transpose').value = 'auto';
    render();
  } catch (err) {
    $('msg').innerHTML = `<div class="warn">${esc(err.message)}</div>`;
  }
  e.target.value = '';
};
